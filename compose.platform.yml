services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_PASSWORD: postgres
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    volumes:
      - vrk-platform-db:/var/lib/postgresql/data

  migrate:
    image: migrate/migrate:v4.19.0
    command:
      [
        "-path=/migrations",
        "-database=postgres://postgres:postgres@db:5432/db?sslmode=disable",
        "up"
      ]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"
    volumes:
      - ./apps/backend/migrations:/migrations:ro

  object-storage:
    image: minio/minio:RELEASE.2025-09-07T16-13-09Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: minio
      MINIO_ROOT_PASSWORD: minio12345
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9000/minio/health/ready >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 5s
    ports:
      - "${OBJECT_STORAGE_HOST_PORT:-19000}:9000"
      - "${OBJECT_STORAGE_CONSOLE_HOST_PORT:-19001}:9001"
    volumes:
      - vrk-platform-object-storage:/data

  object-storage-init:
    image: minio/mc:RELEASE.2025-08-13T08-35-41Z
    depends_on:
      object-storage:
        condition: service_healthy
    entrypoint:
      [
        "/bin/sh",
        "-lc",
        "mc alias set local http://object-storage:9000 minio minio12345 && mc mb --ignore-existing local/vrk-local"
      ]
    restart: "no"

  backend:
    build:
      context: ./apps/backend
      dockerfile: Dockerfile
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      object-storage-init:
        condition: service_completed_successfully
    environment:
      DB_HOST: db
      DB_NAME: db
      DB_PASSWORD: postgres
      DB_PORT: "5432"
      DB_SSL_MODE: disable
      DB_USER: postgres
      ENVIRONMENT: development
      OBJECT_STORAGE_ACCESS_KEY_ID: minio
      OBJECT_STORAGE_BUCKET: vrk-local
      OBJECT_STORAGE_ENDPOINT: http://object-storage:9000
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_REGION: ru-central1
      OBJECT_STORAGE_SECRET_ACCESS_KEY: minio12345
      PLATFORM_ADMIN_SHARED_SECRET: stage03-platform-admin-secret
      SERVER_PORT: "8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://localhost:8080/healthz >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${BACKEND_HOST_PORT:-18080}:8080"

  dev-seed:
    build:
      context: .
      dockerfile: scripts/Dockerfile.dev-seed
    depends_on:
      backend:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_NAME: db
      DB_PASSWORD: postgres
      DB_PORT: "5432"
      DB_USER: postgres
      DEV_SEED_API_BASE_URL: http://backend:8080/api/v1
      DEV_SEED_DISPLAY_OUTPUT_PATH: .local/dev-seed.json
      DEV_SEED_OUTPUT_PATH: /workspace/.local/dev-seed.json
      DEV_SEED_WEB_URL: "http://localhost:${WEB_HOST_PORT:-3100}"
      PLATFORM_ADMIN_SHARED_SECRET: stage03-platform-admin-secret
    restart: "no"
    volumes:
      - ./scripts:/workspace/scripts:ro
      - ./.local:/workspace/.local

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8080
        NEXT_PUBLIC_RUNTIME_DATA_MODE: seed-read
        NEXT_PUBLIC_STORYBOOK_URL: "http://localhost:${WEB_HOST_PORT:-3100}/storybook/"
    depends_on:
      backend:
        condition: service_healthy
    environment:
      INTERNAL_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_RUNTIME_DATA_MODE: seed-read
      NEXT_PUBLIC_STORYBOOK_URL: "http://localhost:${WEB_HOST_PORT:-3100}/storybook/"
      PLATFORM_ADMIN_SHARED_SECRET: stage03-platform-admin-secret
      PORT: "3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3000/login >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${WEB_HOST_PORT:-3100}:3000"

  field:
    build:
      context: .
      dockerfile: apps/field/Dockerfile
      args:
        NEXT_PUBLIC_API_BASE_URL: http://backend:8080
        NEXT_PUBLIC_MANUAL_SYNC_MODE: queue-preview
    depends_on:
      backend:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://backend:8080
      NEXT_PUBLIC_MANUAL_SYNC_MODE: queue-preview
      PORT: "3002"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O - http://127.0.0.1:3002/ >/dev/null"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 10s
    ports:
      - "${FIELD_HOST_PORT:-3102}:3002"

volumes:
  vrk-platform-db:
  vrk-platform-object-storage:
