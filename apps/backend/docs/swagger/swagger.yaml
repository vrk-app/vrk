        maxLength: 100
        type: string
      documentProviderOrganization:
        maxLength: 100
        type: string
      documentUrl:
        maxLength: 255
        type: string
      lastOperationDate:
        type: string
      metrologicalOperationTypeId:
        type: string
      nextOperationDate:
        type: string
      organizationId:
