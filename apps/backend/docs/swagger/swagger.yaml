info:
  contact: {}
  title: VRK API
paths:
  /equipment:
    get:
      description: Возвращает список оборудования с пагинацией
      parameters:
      - default: 10
        description: Количество записей на странице
        in: query
        maximum: 100
        minimum: 1
        name: limit
        type: integer
      - default: 0
        description: Смещение
        in: query
        minimum: 0
        name: offset
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: Успешный ответ
          schema:
            allOf:
            - $ref: '#/definitions/equipment.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/equipment.EquipmentResponse'
                  type: array
                meta:
                  $ref: '#/definitions/equipment.Meta'
              type: object
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/equipment.Response'
      summary: Получить список оборудования
      tags:
      - equipment
    post:
      consumes:
      - application/json
      description: Создает новую единицу оборудования
      parameters:
      - description: Данные оборудования
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/equipment.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Оборудование создано
          schema:
            allOf:
            - $ref: '#/definitions/equipment.Response'
            - properties:
                data:
                  $ref: '#/definitions/equipment.EquipmentResponse'
              type: object
        "400":
          description: Неверный запрос
          schema:
            $ref: '#/definitions/equipment.Response'
        "500":
          description: Внутренняя ошибка сервера
          schema:
            $ref: '#/definitions/equipment.Response'
      summary: Создать оборудование
      tags:
      - equipment
  /equipment/{id}:
    delete:
      description: Удаляет оборудование по ID
      parameters:
      - description: ID оборудования
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: Успешное удаление
        "404":
