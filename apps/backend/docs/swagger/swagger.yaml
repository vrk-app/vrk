info:
  contact: {}
  title: VRK API
paths:
  /agreements:
    get:
      description: Returns contracts visible to the authenticated customer or contractor
        organization through the agreements adapter boundary.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/agreement.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/agreement.AgreementResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/agreement.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/agreement.Response'
      summary: List contracts
      tags:
      - agreements
    post:
      consumes:
      - application/json
      description: Creates a Stage 03 contract bound to a customer organization and
        contractor organization while preserving the backend agreements adapter boundary.
      parameters:
      - description: Contract payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agreement.CreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            allOf:
            - $ref: '#/definitions/agreement.Response'
            - properties:
                data:
                  $ref: '#/definitions/agreement.AgreementResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/agreement.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/agreement.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/agreement.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/agreement.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/agreement.Response'
      summary: Create contract
      tags:
      - agreements
  /agreements/{id}:
    get:
      description: Returns one contract visible to the authenticated customer or contractor
        organization.
      parameters:
      - description: Contract ID
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/agreement.Response'
            - properties:
                data:
                  $ref: '#/definitions/agreement.AgreementResponse'
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/agreement.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/agreement.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/agreement.Response'
      summary: Get contract by ID
      tags:
      - agreements
    put:
      consumes:
      - application/json
      description: Updates one customer-owned contract through the legacy agreements
        path while keeping the public web contour named contracts.
      parameters:
      - description: Contract ID
        in: path
        name: id
        required: true
        type: string
      - description: Contract update payload
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/agreement.UpdateRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/agreement.Response'
            - properties:
                data:
                  $ref: '#/definitions/agreement.AgreementResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/agreement.Response'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/agreement.Response'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/agreement.Response'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/agreement.Response'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/agreement.Response'
      summary: Update contract
      tags:
      - agreements
  /agreements/contractors:
    get:
      description: Returns active contractor organizations that can be bound to a
        customer contract.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/agreement.Response'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/agreement.ContractorOptionResponse'
                  type: array
              type: object
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/agreement.Response'
        "403":
          description: Forbidden
