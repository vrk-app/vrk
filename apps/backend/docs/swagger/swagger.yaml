basePath: /api/v1
definitions:
  agreement.AgreementResponse:
    properties:
      endDate:
        type: string
      factoryId:
        type: string
      id:
        type: string
      number:
        type: integer
      organizationId:
        type: string
      scheduleId:
        type: string
      source:
        type: string
      startDate:
        type: string
      subjectOfAgreement:
        type: string
    type: object
  agreement.CreateRequest:
    properties:
      endDate:
        description: формат "2006-01-02"
        type: string
      factoryId:
        type: string
      number:
        type: integer
      organizationId:
        type: string
      scheduleId:
        type: string
      source:
        type: string
      startDate:
        description: формат "2006-01-02"
        type: string
      subjectOfAgreement:
        type: string
    required:
    - endDate
    - factoryId
    - number
    - organizationId
    - scheduleId
    - source
    - startDate
    - subjectOfAgreement
    type: object
  agreement.Meta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  agreement.Response:
    properties:
      data: {}
      error:
        type: string
      meta:
        $ref: '#/definitions/agreement.Meta'
      success:
        type: boolean
    type: object
  agreement.UpdateRequest:
    properties:
      endDate:
        type: string
      factoryId:
        type: string
      number:
        type: integer
      organizationId:
        type: string
      scheduleId:
        type: string
      source:
        type: string
      startDate:
        type: string
      subjectOfAgreement:
        type: string
    type: object
  equipment.CreateRequest:
    properties:
      certificateNumber:
        type: string
      documentProviderOrganization:
        type: string
      documentUrl:
        type: string
      equipmentDictionaryId:
        type: string
      factoryNumber:
        maxLength: 50
        type: string
      inventoryNumber:
        type: string
      lastOperationDate:
        type: string
      manufactureYear:
        type: string
      manufacturerId:
        type: string
      metrologicalCharacteristics:
        description: Для эталонов
        type: string
      metrologicalOperationTypeId:
        description: Для средств измерения
        type: integer
      nextOperationDate:
        type: string
      organizationId:
        type: string
      standardId:
        type: string
      statusId:
        maximum: 5
        minimum: 1
        type: integer
    required:
    - equipmentDictionaryId
    - factoryNumber
    - manufactureYear
    - manufacturerId
    - organizationId
    - statusId
    type: object
  equipment.EquipmentResponse:
    properties:
      createdAt:
        type: string
      equipmentName:
        type: string
      factoryNumber:
        type: string
      id:
        type: string
      inventoryNumber:
        type: string
      manufactureYear:
        type: string
      manufacturerName:
        type: string
      measuringInstrument:
        $ref: '#/definitions/equipment.MeasuringInstrumentInfo'
      model:
        type: string
      organizationName:
        type: string
      standard:
        $ref: '#/definitions/equipment.StandardInfo'
      statusId:
        type: integer
      statusName:
        type: string
      updatedAt:
        type: string
      usageClassification:
        type: string
    type: object
  equipment.MeasuringInstrumentInfo:
    properties:
      certificateNumber:
        type: string
      documentProviderOrganization:
        type: string
      documentUrl:
        type: string
      id:
        type: string
      lastOperationDate:
        type: string
      metrologicalOperationType:
        type: string
      metrologicalOperationTypeId:
        type: integer
      nextOperationDate:
        type: string
      registryNumber:
        type: string
      standardId:
        type: string
    type: object
  equipment.Meta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  equipment.Response:
    properties:
      data: {}
      error:
        type: string
      meta:
        $ref: '#/definitions/equipment.Meta'
      success:
        type: boolean
    type: object
  equipment.StandardInfo:
    properties:
      certificateNumber:
        type: string
      documentProviderOrganization:
        type: string
      documentUrl:
        type: string
      id:
        type: string
      lastOperationDate:
        type: string
      metrologicalCharacteristics:
        type: string
      nextOperationDate:
        type: string
    type: object
  equipmentdictionary.ApiResponse:
    properties:
      data: {}
      error:
        type: string
      meta:
        $ref: '#/definitions/equipmentdictionary.Meta'
      success:
        type: boolean
    type: object
  equipmentdictionary.CreateEquipmentDictionaryRequest:
    properties:
      fullName:
        type: string
      measuringInstrument:
        $ref: '#/definitions/equipmentdictionary.MeasuringInstrumentInput'
      model:
        type: string
    type: object
  equipmentdictionary.EquipmentDictionaryFull:
    properties:
      createdAt:
        type: string
      fullName:
        type: string
      id:
        type: string
      mid:
        $ref: '#/definitions/equipmentdictionary.MeasuringInstrumentsDictionaryFull'
      model:
        type: string
      updatedAt:
        type: string
    type: object
  equipmentdictionary.MeasuringInstrumentInput:
    properties:
      metrologicalOperationTypeId:
        type: integer
      registryNumber:
        type: string
      standards:
        example:
        - standardModel
        items:
          type: string
        type: array
    type: object
  equipmentdictionary.MeasuringInstrumentsDictionaryFull:
    properties:
      id:
        type: string
      metrologicalOperationType:
        type: string
      metrologicalOperationTypeID:
        format: int32
        type: integer
      registryNumber:
        type: string
      standards:
        items:
          $ref: '#/definitions/equipmentdictionary.StandardsDictionaryFull'
        type: array
    type: object
  equipmentdictionary.Meta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  equipmentdictionary.StandardsDictionaryFull:
    properties:
      id:
        type: string
      model:
        type: string
    type: object
  equipmentdictionary.UpdateEquipmentDictionaryRequest:
    properties:
      fullName:
        type: string
      measuringInstrument:
        $ref: '#/definitions/equipmentdictionary.MeasuringInstrumentInput'
      measuringInstrumentDictionaryId:
        type: string
      model:
        type: string
    type: object
  manufacturer.CreateRequest:
    properties:
      classificationID:
        format: int32
        type: integer
      name:
        type: string
    required:
    - name
    type: object
  manufacturer.ManufacturerResponse:
    properties:
      classificationID:
        format: int32
        type: integer
      createdAt:
        type: string
      id:
        type: string
      name:
        type: string
      updatedAt:
        type: string
    type: object
  manufacturer.Meta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  manufacturer.Response:
    properties:
      data: {}
      error:
        type: string
      meta:
        $ref: '#/definitions/manufacturer.Meta'
      success:
        type: boolean
    type: object
  manufacturer.UpdateRequest:
    properties:
      classificationID:
        format: int32
        type: integer
      name:
        type: string
    type: object
  metrologicaltype.CreateRequest:
    properties:
      metrologicalOperationType:
        type: string
    required:
    - metrologicalOperationType
    type: object
  metrologicaltype.Meta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  metrologicaltype.MetrologicalTypeResponse:
    properties:
      createdAt:
        type: string
      id:
        type: integer
      metrologicalOperationType:
        type: string
    type: object
  metrologicaltype.Response:
    properties:
      data: {}
      error:
        type: string
      meta:
        $ref: '#/definitions/metrologicaltype.Meta'
      success:
        type: boolean
    type: object
  organization.CreateRequest:
    properties:
      address:
        maxLength: 100
        type: string
      directorId:
        type: string
      inn:
        type: string
      kpp:
        type: string
      logo:
        type: string
      name:
        maxLength: 200
        type: string
      parentId:
        type: string
      poaExpirationDate:
        type: string
      poaissueDate:
        type: string
      powerOfAttorneyNumber:
        type: string
      propertyTypeId:
        type: string
      roleId:
        type: string
      shortName:
        type: string
    required:
    - address
    - directorId
    - inn
    - kpp
    - name
    - propertyTypeId
    - roleId
    type: object
  organization.Meta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  organization.OrganizationResponse:
    properties:
      address:
        type: string
      directorName:
        type: string
      id:
        type: string
      inn:
        type: string
      kpp:
        type: string
      logo:
        type: string
      name:
        type: string
      parentId:
        type: string
      poaExpirationDate:
        type: string
      poaIssueDate:
        type: string
      powerOfAttorneyNumber:
        type: string
      propertyType:
        type: string
      role:
        type: string
      shortName:
        type: string
    type: object
  organization.Response:
    properties:
      data: {}
      error:
        type: string
      meta:
        $ref: '#/definitions/organization.Meta'
      success:
        type: boolean
    type: object
  organization.UpdateRequest:
    properties:
      address:
        type: string
      directorId:
        type: string
      inn:
        type: string
      kpp:
        type: string
      logo:
        type: string
      name:
        type: string
      parentId:
        type: string
