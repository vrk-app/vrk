      organizationId:
        type: string
      registrationYear:
        type: string
      statusId:
        type: integer
      updatedAt:
        type: string
    type: object
  equipment.Meta:
    properties:
      limit:
        type: integer
      offset:
        type: integer
      total:
        type: integer
    type: object
  equipment.Response:
    properties:
      data: {}
