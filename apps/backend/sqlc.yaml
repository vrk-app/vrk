version: "2"
sql:
  - engine: "postgresql"
    queries: "internal/db/queries/auth"
    schema: "migrations"
    gen:
      go:
        package: "generated"
        out: "internal/db/generated"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        json_tags_case_style: "camel"

  - engine: "postgresql"
    queries: "internal/db/queries/equipment"
    schema: "migrations"
    gen:
      go:
        package: "generated"
        out: "internal/db/generated"
        sql_package: "database/sql"
        emit_interface: true
        emit_empty_slices: true
        emit_json_tags: true
        json_tags_case_style: "camel"